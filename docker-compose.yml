# Local development runtime: PostgreSQL + MinIO (S3-compatible object storage).
# `docker compose up -d` then `pnpm db:migrate && pnpm db:seed`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: workpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpay
      POSTGRES_PASSWORD: workpay
      POSTGRES_DB: workpay
    ports:
      # Host port is configurable so WorkPay does not collide with a local
      # PostgreSQL already bound to 5432. Set POSTGRES_PORT in .env if needed.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workpay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpay -d workpay"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: workpay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workpay
      MINIO_ROOT_PASSWORD: workpay-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - workpay-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the object-storage bucket on first boot.
  minio-init:
    image: minio/mc:latest
    container_name: workpay-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 workpay workpay-secret &&
      mc mb --ignore-existing local/workpay-artifacts &&
      echo 'bucket ready'
      "

volumes:
  workpay-pgdata:
  workpay-miniodata:
